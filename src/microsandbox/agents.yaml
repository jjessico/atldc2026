image: { oci: "node:24-bookworm-slim", upper_size: "8G" }
cpus: 1
memory: "1G"
workdir: "/workspace"
shell: "/bin/bash"
mounts:
  - "./agent_workspace:/workspace"
network:
  strict: false
  allow:
    # Model APIs and auth
    - api.anthropic.com
    - console.anthropic.com
    - suffix=claude.ai
    - suffix=claude.com
    - api.openai.com
    - auth.openai.com
    - chatgpt.com
    - models.dev
    - opencode.ai
    # Code and packages
    - deb.debian.org
    - security.debian.org
    - github.com
    - api.github.com
    - codeload.github.com
    - raw.githubusercontent.com
    - registry.npmjs.org
scripts:
  setup: |
    set -euo pipefail
    apt-get update
    apt-get install -y --no-install-recommends ca-certificates git tmux
    rm -rf /var/lib/apt/lists/*
    npm install -g \
      @anthropic-ai/claude-code@2.1.289 \
      @openai/codex@0.160.1 \
      opencode-ai@1.18.34
